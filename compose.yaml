services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cineatlas
      POSTGRES_USER: cineatlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineatlas"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cineatlas:${DB_PASSWORD:-local-dev-only}@db:5432/cineatlas
      CINEATLAS_COOKIE_SECURE: ${CINEATLAS_COOKIE_SECURE:-false}
      CINEATLAS_WEB_ORIGINS: ${CINEATLAS_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata:
